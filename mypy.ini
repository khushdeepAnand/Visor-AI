[mypy]
# Deterministic repository check: python -m mypy --config-file mypy.ini .
python_version = 3.12
strict = True
incremental = False
explicit_package_bases = True
show_error_codes = True
warn_unused_configs = True
# Calls into these three explicitly listed legacy modules remain dynamically
# typed; callers and all typed function bodies are still checked.
untyped_calls_exclude = database, authentication, indicators
# Tests/environments are not application source. The remaining exclusions are
# generated model/protobuf output and the optional TensorFlow implementation.
exclude = (?x)(
    ^tests[\\/]
    | ^(?:\.venv|venv)[\\/]
    | ^local-history[\\/]
    | ^models[\\/]trained[\\/]
    | ^prediction_lstm\.py$
    | _pb2(?:_grpc)?\.py$
    )

# These dependencies do not publish complete inline typing. Imports remain
# checked at their typed StockPilot adapters; only the external boundary is Any.
[mypy-sklearn.*,joblib.*,catboost.*,statsmodels.*,scipy.*,apscheduler.*,transformers.*,yfinance.*]
ignore_missing_imports = True

# Optional runtime dependencies with no published type information.
[mypy-arch.*,defusedxml.*,shap.*]
ignore_missing_imports = True

# Research/validation dependencies are dynamically typed external boundaries.
[mypy-mlflow.*,pandera.*]
follow_imports = skip
ignore_missing_imports = True

# Optional TensorFlow support is excluded above because requirements-optional.txt
# is not part of the runtime/dev environment.

# Legacy modules below are checked, including all typed function bodies, but
# still contain public functions awaiting annotations. Keep these exceptions
# module-scoped so every new application module starts fully strict.
[mypy-utils.signals,utils.formatters,database,authentication,indicators,prediction,derivatives.options_engine,services.sentiment,services.search_engine,services.market_loader,middleware.security,middleware.observability,models.advanced_boosters,model_tuning]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

[mypy-services.google_oauth]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_any_generics = False

[mypy-services.market_data.manager]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
warn_return_any = False

[mypy-services.market_data.live_hub]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_any_generics = False

[mypy-api.scheduler]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

[mypy-api.main,api.deps,api.routers.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
warn_return_any = False

# Dynamic database/provider payloads still return Any at these named legacy
# adapters. Other strict checks remain enabled for each module.
[mypy-services.market_data.upstox_auth,services.market_data.streaming.upstox_stream]
warn_return_any = False

[mypy-services.market_calendar]
warn_return_any = False
disallow_any_generics = False

[mypy-services.auth_api,services.alerts]
warn_return_any = False
disallow_untyped_calls = False

[mypy-services.paper_trading_v6]
warn_return_any = False
disallow_any_generics = False
disallow_untyped_calls = False

# Existing container APIs without generic parameters; isolated until annotated.
[mypy-services.reports,services.market_data.context,services.watchlist_service]
disallow_any_generics = False
